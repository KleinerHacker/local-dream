name: Test APK

# Fork-only workflow, not part of the upstream pull request.
# Builds the privacy-options changes into an installable test APK. The native
# backend (QNN/MNN libraries and libstable_diffusion_core.so) is not rebuilt:
# it is taken unchanged from the official upstream release of the exact same
# version, because building it needs Qualcomm's QNN SDK.

on:
  push:
    branches: [ci-build]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_TAG: v3.0.0-alpha.7

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check that the source matches the upstream release
        run: |
          grep -q "versionName = \"${UPSTREAM_TAG#v}\"" app/build.gradle.kts \
            || { echo "versionName does not match $UPSTREAM_TAG"; exit 1; }

      - name: Download the official release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          gh release download "$UPSTREAM_TAG" -R xororz/local-dream -p "*.apk" -D "$RUNNER_TEMP/upstream"
          ls -l "$RUNNER_TEMP/upstream"
          APK=$(ls "$RUNNER_TEMP"/upstream/*.apk | grep -v with_filter | head -n1)
          test -n "$APK" || { echo "no unfiltered APK in $UPSTREAM_TAG"; exit 1; }
          echo "UPSTREAM_APK=$APK" >> "$GITHUB_ENV"

      - name: Take the native backend from the official APK
        run: |
          X="$RUNNER_TEMP/x"
          mkdir -p "$X"
          unzip -q -o "$UPSTREAM_APK" 'lib/arm64-v8a/*' 'assets/qnnlibs/*' 'assets/ditlibs/*' 'assets/licenses/*' -d "$X" || true
          test -f "$X/lib/arm64-v8a/libstable_diffusion_core.so" || { echo "backend library missing"; exit 1; }
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$X"/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          for d in qnnlibs ditlibs; do
            if [ -d "$X/assets/$d" ]; then mkdir -p "app/src/main/assets/$d" && cp -r "$X/assets/$d/." "app/src/main/assets/$d/"; fi
          done
          for d in "$X"/assets/licenses/qnn-*; do
            [ -d "$d" ] && cp -r "$d" app/src/main/assets/licenses/
          done
          ls -l app/src/main/jniLibs/arm64-v8a app/src/main/assets/qnnlibs

      - name: Test build settings (own package id, duplicate .so from dependencies)
        run: |
          # Own package id, so the test build installs next to the official app.
          sed -i 's/applicationId = "io.github.xororz.localdream"/applicationId = "io.github.xororz.localdream"\n        applicationIdSuffix = ".privacytest"/' app/build.gradle.kts
          # Libraries copied from the official APK may also come from Gradle dependencies.
          sed -i 's/useLegacyPackaging = true/useLegacyPackaging = true\n            pickFirsts += "**\/*.so"/' app/build.gradle.kts
          grep -nE 'applicationIdSuffix|pickFirsts' app/build.gradle.kts

      - name: Throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass test-pass -keypass test-pass \
            -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Local Dream privacy test" -noprompt
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/test.jks"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=test-pass"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=test"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=test-pass"
          } >> "$GITHUB_ENV"

      - name: Build release APKs (basic and filter)
        run: ./gradlew --no-daemon assembleBasicRelease assembleFilterRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          cd out
          for f in *.apk; do mv "$f" "${f%.apk}_privacytest.apk"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: out/*.apk

      - name: Publish as a pre-release in this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="privacytest-${GITHUB_SHA::7}"
          NOTES="Test build of the privacy-options branch (upstream PR #352) on top of $UPSTREAM_TAG.
          Package id io.github.xororz.localdream.privacytest, so it installs next to the official app.
          Native backend taken unchanged from the official $UPSTREAM_TAG release.
          Signed with a throwaway key: uninstall before installing a newer test build.
          Licensed CC BY-NC 4.0 like upstream; non-commercial use only."
          gh release create "$TAG" out/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Privacy test build ${GITHUB_SHA::7}" --notes "$NOTES"
