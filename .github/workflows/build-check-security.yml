name: Build check (security)

on:
  push:
    branches: [ci-security]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Throwaway signing key (the build signs debug with the release config)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass ci-pass -keypass ci-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" -noprompt
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/ci.jks"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=ci-pass"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=ci"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=ci-pass"
          } >> "$GITHUB_ENV"

      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: detekt
        run: ./gradlew --no-daemon detekt

      - name: Unit tests (basic, debug)
        run: ./gradlew --no-daemon testBasicDebugUnitTest

      - name: Compile and assemble (basic, debug)
        run: ./gradlew --no-daemon assembleBasicDebug

      - name: Android lint (basic, debug)
        run: ./gradlew --no-daemon lintBasicDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
